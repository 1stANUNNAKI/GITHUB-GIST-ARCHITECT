name: Live GitHub Profile Telemetry & SVG Auto-Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-profile-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Profile Repository
        uses: actions/checkout@v4

      - name: Set Up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute Live Telemetry & SVG Sync
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/sync_metrics.py

      - name: Commit and Push Updated Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md *.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(telemetry): auto-sync live profile metrics and SVG cards"
            git push
          fi
